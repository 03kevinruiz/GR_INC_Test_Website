<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GR Admin — Media Manager</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230F2D3D'/><text x='16' y='22' text-anchor='middle' font-family='system-ui,sans-serif' font-weight='900' font-size='14' fill='%23E8730A'>GR</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --t900: #0F2D3D; --t800: #1A3D50; --t700: #1E5068;
    --t600: #267A94; --t500: #2E8FA5; --t400: #4AACBE; --t200: #A8DCE8; --t100: #E6F4F8;
    --or: #E8730A; --or-dk: #C8620A;
    --bg: #F4F7F9; --surface: #FFFFFF; --border: #DDE5EA;
    --text: #1A3D50; --muted: #6B8798; --danger: #D94040;
    --sidebar-w: 220px; --panel-w: 280px;
    --font-h: 'Montserrat', sans-serif; --font-b: 'Inter', sans-serif;
    --radius: 6px; --radius-lg: 10px;
    --shadow: 0 2px 10px rgba(15,45,61,0.08); --shadow-lg: 0 8px 30px rgba(15,45,61,0.14);
    --trans: 180ms cubic-bezier(0.4,0,0.2,1);
  }
  html, body { height: 100%; font-family: var(--font-b); color: var(--text); background: var(--bg); }
  button { cursor: pointer; font-family: var(--font-b); }
  input, textarea { font-family: var(--font-b); }
  *:focus-visible { outline: 2px solid var(--t500); outline-offset: 2px; border-radius: 3px; }
  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--t400); border-radius: 3px; }

  /* ── Layout ──────────────────────────────────────────────────────────── */
  #app { display: flex; height: 100vh; overflow: hidden; }

  /* ── Sidebar (Services) ──────────────────────────────────────────────── */
  #sidebar {
    width: var(--sidebar-w); min-width: var(--sidebar-w);
    background: var(--t900); display: flex; flex-direction: column;
    border-right: 1px solid rgba(255,255,255,0.06);
  }
  #sidebar-header {
    padding: 18px 16px 14px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    display: flex; align-items: center; gap: 10px;
  }
  #sidebar-header img { height: 34px; width: auto; }
  #sidebar-header .admin-badge {
    font-family: var(--font-h); font-size: 9px; font-weight: 700; letter-spacing: 0.12em;
    color: var(--or); text-transform: uppercase; background: rgba(232,115,10,0.12);
    padding: 2px 6px; border-radius: 3px; border: 1px solid rgba(232,115,10,0.25);
  }
  #sidebar-label {
    padding: 14px 16px 6px;
    font-family: var(--font-h); font-size: 9px; font-weight: 700; letter-spacing: 0.14em;
    text-transform: uppercase; color: rgba(255,255,255,0.28);
  }
  #services-list { flex: 1; overflow-y: auto; padding: 4px 8px; }
  .svc-item {
    display: flex; align-items: center; gap: 8px; padding: 9px 10px;
    border-radius: var(--radius); cursor: pointer;
    color: rgba(255,255,255,0.6); font-size: 13.5px; font-weight: 500;
    transition: background var(--trans), color var(--trans);
    user-select: none;
  }
  .svc-item:hover { background: rgba(255,255,255,0.07); color: rgba(255,255,255,0.9); }
  .svc-item.active { background: rgba(232,115,10,0.18); color: #fff; font-weight: 600; }
  .svc-item .svc-icon { font-size: 16px; flex-shrink: 0; }
  .svc-item .svc-count {
    margin-left: auto; font-size: 10px; font-weight: 600;
    background: rgba(255,255,255,0.1); border-radius: 10px;
    padding: 1px 6px; color: rgba(255,255,255,0.45);
  }
  .svc-item.active .svc-count { background: rgba(232,115,10,0.25); color: var(--or); }
  #btn-new-svc {
    margin: 8px; padding: 9px 12px; border-radius: var(--radius);
    background: rgba(232,115,10,0.15); border: 1px dashed rgba(232,115,10,0.35);
    color: var(--or); font-size: 12.5px; font-weight: 600; font-family: var(--font-h);
    display: flex; align-items: center; gap: 6px;
    transition: background var(--trans), border-color var(--trans);
  }
  #btn-new-svc:hover { background: rgba(232,115,10,0.25); border-color: rgba(232,115,10,0.55); }

  /* ── Projects Panel ──────────────────────────────────────────────────── */
  #projects-panel {
    width: var(--panel-w); min-width: var(--panel-w); background: var(--surface);
    border-right: 1px solid var(--border); display: flex; flex-direction: column;
    transition: opacity var(--trans);
  }
  #projects-panel-header {
    padding: 16px 16px 12px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  #projects-panel-title {
    font-family: var(--font-h); font-size: 13px; font-weight: 700;
    color: var(--t900); text-transform: uppercase; letter-spacing: 0.06em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #btn-new-proj {
    flex-shrink: 0; padding: 5px 11px; border-radius: var(--radius);
    background: var(--or); border: none; color: #fff;
    font-size: 11.5px; font-weight: 700; font-family: var(--font-h);
    display: flex; align-items: center; gap: 4px;
    transition: background var(--trans), box-shadow var(--trans), transform var(--trans);
    box-shadow: 0 2px 8px rgba(232,115,10,0.25);
  }
  #btn-new-proj:hover { background: var(--or-dk); box-shadow: 0 4px 16px rgba(232,115,10,0.35); }
  #btn-new-proj:active { transform: scale(0.96); }
  #projects-list { flex: 1; overflow-y: auto; padding: 8px; }
  .proj-card {
    padding: 12px; border-radius: var(--radius); cursor: pointer; margin-bottom: 6px;
    border: 1.5px solid transparent; background: var(--bg);
    transition: border-color var(--trans), background var(--trans), box-shadow var(--trans);
    position: relative;
  }
  .proj-card:hover { border-color: var(--t400); background: #fff; box-shadow: var(--shadow); }
  .proj-card.active { border-color: var(--t500); background: #fff; box-shadow: var(--shadow); }
  .proj-card .cover-thumb {
    width: 100%; height: 100px; object-fit: cover; border-radius: 4px;
    background: var(--t100); display: block; margin-bottom: 9px;
  }
  .proj-card .cover-placeholder {
    width: 100%; height: 100px; border-radius: 4px;
    background: var(--t100); display: flex; align-items: center; justify-content: center;
    font-size: 28px; margin-bottom: 9px;
  }
  .proj-card .proj-name {
    font-family: var(--font-h); font-size: 12.5px; font-weight: 700; color: var(--t900);
    line-height: 1.35; margin-bottom: 2px;
  }
  .proj-card .proj-meta {
    font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 8px;
  }
  .proj-card .proj-actions {
    position: absolute; top: 8px; right: 8px; display: none; gap: 4px;
  }
  .proj-card:hover .proj-actions, .proj-card.active .proj-actions { display: flex; }
  .proj-card .proj-actions button {
    width: 26px; height: 26px; border-radius: 4px; border: none;
    display: flex; align-items: center; justify-content: center; font-size: 13px;
    transition: background var(--trans);
  }
  .proj-card .proj-actions .btn-edit-proj { background: rgba(46,143,165,0.1); color: var(--t600); }
  .proj-card .proj-actions .btn-edit-proj:hover { background: rgba(46,143,165,0.22); }
  .proj-card .proj-actions .btn-del-proj { background: rgba(217,64,64,0.08); color: var(--danger); }
  .proj-card .proj-actions .btn-del-proj:hover { background: rgba(217,64,64,0.18); }
  #projects-empty {
    padding: 40px 16px; text-align: center; color: var(--muted); font-size: 13px; line-height: 1.6;
  }
  #projects-empty .big-icon { font-size: 36px; margin-bottom: 10px; }

  /* ── Media Panel (main) ──────────────────────────────────────────────── */
  #media-panel {
    flex: 1; overflow: hidden; display: flex; flex-direction: column;
    background: var(--bg);
  }
  #media-header {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 14px 20px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  }
  #media-breadcrumb {
    flex: 1; font-size: 13px; color: var(--muted);
  }
  #media-breadcrumb strong { color: var(--t900); font-weight: 600; }
  #media-header .header-actions { display: flex; gap: 8px; align-items: center; }
  #media-count { font-size: 12px; color: var(--muted); white-space: nowrap; }
  #btn-upload-trigger {
    padding: 8px 16px; border-radius: var(--radius);
    background: var(--t700); border: none; color: #fff;
    font-size: 12.5px; font-weight: 600; font-family: var(--font-h);
    display: flex; align-items: center; gap: 6px;
    transition: background var(--trans), box-shadow var(--trans), transform var(--trans);
    box-shadow: 0 2px 8px rgba(30,80,104,0.2);
  }
  #btn-upload-trigger:hover { background: var(--t600); box-shadow: 0 4px 16px rgba(30,80,104,0.28); }
  #btn-upload-trigger:active { transform: scale(0.97); }
  #file-input { display: none; }

  #media-body { flex: 1; overflow-y: auto; padding: 20px; }

  /* Upload drop zone */
  #drop-zone {
    border: 2px dashed var(--t400); border-radius: var(--radius-lg);
    padding: 28px 24px; text-align: center; margin-bottom: 20px;
    background: rgba(168,220,232,0.08);
    transition: background var(--trans), border-color var(--trans);
    cursor: pointer;
  }
  #drop-zone.drag-over { background: rgba(46,143,165,0.12); border-color: var(--t500); }
  #drop-zone.uploading { pointer-events: none; opacity: 0.7; }
  #drop-zone .dz-icon { font-size: 32px; margin-bottom: 8px; line-height: 1; }
  #drop-zone .dz-title {
    font-family: var(--font-h); font-size: 14px; font-weight: 700; color: var(--t800); margin-bottom: 4px;
  }
  #drop-zone .dz-sub { font-size: 12px; color: var(--muted); }
  #drop-zone .dz-progress { margin-top: 10px; display: none; }
  #drop-zone .dz-progress-bar {
    height: 4px; border-radius: 2px; background: var(--t100); overflow: hidden;
  }
  #drop-zone .dz-progress-fill {
    height: 100%; width: 0%; background: var(--t500); border-radius: 2px;
    transition: width 0.2s ease;
  }
  #drop-zone .dz-progress-text { font-size: 11px; color: var(--muted); margin-top: 4px; }

  /* Media grid */
  #media-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 10px;
  }
  .media-item {
    border-radius: var(--radius); overflow: hidden; background: var(--surface);
    box-shadow: var(--shadow); position: relative; cursor: grab;
    transition: box-shadow var(--trans), transform var(--trans);
    aspect-ratio: 1;
  }
  .media-item:hover { box-shadow: var(--shadow-lg); transform: translateY(-2px); }
  .media-item.dragging { opacity: 0.4; cursor: grabbing; }
  .media-item.drag-over-item { box-shadow: 0 0 0 2px var(--t500); }
  .media-item img, .media-item video {
    width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none;
  }
  .media-item .media-overlay {
    position: absolute; inset: 0; background: linear-gradient(to top, rgba(15,45,61,0.65) 0%, transparent 50%);
    opacity: 0; transition: opacity var(--trans);
    display: flex; flex-direction: column; justify-content: flex-end; padding: 8px;
  }
  .media-item:hover .media-overlay { opacity: 1; }
  .media-item .media-actions { display: flex; gap: 4px; justify-content: flex-end; position: absolute; top: 6px; right: 6px; }
  .media-item .media-actions button {
    width: 28px; height: 28px; border-radius: 4px; border: none;
    display: flex; align-items: center; justify-content: center; font-size: 14px;
    opacity: 0; transition: opacity var(--trans), background var(--trans);
  }
  .media-item:hover .media-actions button { opacity: 1; }
  .media-item .btn-set-cover {
    background: rgba(255,255,255,0.85); color: var(--t800);
  }
  .media-item .btn-set-cover:hover { background: #fff; }
  .media-item .btn-del-media { background: rgba(217,64,64,0.85); color: #fff; }
  .media-item .btn-del-media:hover { background: var(--danger); }
  .media-item .cover-badge {
    position: absolute; top: 6px; left: 6px;
    background: var(--or); color: #fff; font-size: 9px; font-weight: 700;
    letter-spacing: 0.08em; text-transform: uppercase;
    padding: 2px 6px; border-radius: 3px; font-family: var(--font-h);
  }
  .media-item .media-name {
    font-size: 10px; color: rgba(255,255,255,0.75);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .media-item .drag-handle {
    position: absolute; bottom: 6px; left: 6px; opacity: 0;
    transition: opacity var(--trans); color: rgba(255,255,255,0.6); font-size: 14px;
  }
  .media-item:hover .drag-handle { opacity: 1; }

  /* No-selection states */
  #no-service-msg, #no-project-msg {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 40px; text-align: center; color: var(--muted);
  }
  #no-service-msg .big-icon, #no-project-msg .big-icon { font-size: 48px; margin-bottom: 16px; }
  #no-service-msg h3, #no-project-msg h3 { font-family: var(--font-h); font-size: 16px; color: var(--t800); margin-bottom: 6px; }
  #no-service-msg p, #no-project-msg p { font-size: 13px; line-height: 1.6; max-width: 280px; }

  /* ── Modals ──────────────────────────────────────────────────────────── */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(15,45,61,0.55);
    backdrop-filter: blur(3px); z-index: 1000;
    display: flex; align-items: center; justify-content: center; padding: 20px;
    opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
  }
  .modal-backdrop.open { opacity: 1; pointer-events: all; }
  .modal {
    background: var(--surface); border-radius: var(--radius-lg);
    box-shadow: 0 20px 60px rgba(15,45,61,0.3); width: 100%; max-width: 440px;
    padding: 28px; transform: translateY(12px); transition: transform 0.22s cubic-bezier(0.22,1,0.36,1);
  }
  .modal-backdrop.open .modal { transform: translateY(0); }
  .modal h2 { font-family: var(--font-h); font-size: 17px; font-weight: 800; color: var(--t900); margin-bottom: 20px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; font-weight: 600; color: var(--t700); margin-bottom: 5px; }
  .field input, .field textarea, .field select {
    width: 100%; padding: 9px 12px; border-radius: var(--radius);
    border: 1.5px solid var(--border); font-size: 13.5px; color: var(--text);
    background: var(--bg); transition: border-color var(--trans), box-shadow var(--trans);
  }
  .field input:focus, .field textarea:focus, .field select:focus {
    border-color: var(--t500); box-shadow: 0 0 0 3px rgba(46,143,165,0.12); outline: none;
  }
  .field textarea { resize: vertical; min-height: 72px; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }
  .btn-cancel {
    padding: 9px 18px; border-radius: var(--radius); border: 1.5px solid var(--border);
    background: transparent; color: var(--muted); font-size: 13px; font-weight: 600;
    transition: border-color var(--trans), color var(--trans);
  }
  .btn-cancel:hover { border-color: var(--t400); color: var(--t700); }
  .btn-save {
    padding: 9px 20px; border-radius: var(--radius); border: none;
    background: var(--t700); color: #fff; font-size: 13px; font-weight: 700;
    font-family: var(--font-h); transition: background var(--trans), box-shadow var(--trans);
    box-shadow: 0 2px 8px rgba(30,80,104,0.2);
  }
  .btn-save:hover { background: var(--t600); box-shadow: 0 4px 14px rgba(30,80,104,0.28); }
  .btn-danger-save {
    padding: 9px 20px; border-radius: var(--radius); border: none;
    background: var(--danger); color: #fff; font-size: 13px; font-weight: 700;
    font-family: var(--font-h); transition: background var(--trans);
  }
  .btn-danger-save:hover { background: #bf3535; }

  /* Toast */
  #toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
    background: var(--t900); color: #fff; padding: 10px 20px; border-radius: 30px;
    font-size: 13px; font-weight: 500; box-shadow: 0 8px 24px rgba(0,0,0,0.25);
    z-index: 2000; transition: transform 0.3s cubic-bezier(0.22,1,0.36,1);
    pointer-events: none; white-space: nowrap;
  }
  #toast.show { transform: translateX(-50%) translateY(0); }
  #toast.success::before { content: '✓ '; color: var(--t400); }
  #toast.error::before { content: '✕ '; color: #f87171; }

  /* Loading spinner */
  .spinner {
    width: 20px; height: 20px; border: 2px solid rgba(255,255,255,0.25);
    border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite;
    display: inline-block; vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Service edit/delete button in sidebar */
  .svc-item-actions { display: none; gap: 2px; margin-left: auto; flex-shrink: 0; }
  .svc-item:hover .svc-item-actions, .svc-item.active .svc-item-actions { display: flex; }
  .svc-item .svc-count { display: none; }
  .svc-item:not(:hover):not(.active) .svc-count { display: inline; }
  .svc-item-actions button {
    width: 22px; height: 22px; border-radius: 3px; border: none;
    display: flex; align-items: center; justify-content: center; font-size: 11px;
    transition: background var(--trans);
  }
  .svc-item-actions .btn-edit-svc { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.5); }
  .svc-item-actions .btn-edit-svc:hover { background: rgba(255,255,255,0.16); color: #fff; }
  .svc-item-actions .btn-del-svc { background: rgba(217,64,64,0.12); color: rgba(255,80,80,0.7); }
  .svc-item-actions .btn-del-svc:hover { background: rgba(217,64,64,0.25); color: #f87171; }
</style>
</head>
<body>
<div id="app">

  <!-- ── Sidebar (Services) ─────────────────────────────────────────────── -->
  <aside id="sidebar">
    <div id="sidebar-header">
      <img src="brand_assets/GR_Improvements_Logo.PNG" alt="GR Inc." onerror="this.style.display='none'" />
      <span class="admin-badge">Admin</span>
    </div>
    <div id="sidebar-label">Services</div>
    <div id="services-list">
      <div style="padding:20px;text-align:center;color:rgba(255,255,255,0.25);font-size:12px;">Loading…</div>
    </div>
    <button id="btn-new-svc">
      <span>＋</span> New Service
    </button>
  </aside>

  <!-- ── Projects Panel ─────────────────────────────────────────────────── -->
  <div id="projects-panel">
    <div id="projects-panel-header">
      <div id="projects-panel-title">Projects</div>
      <button id="btn-new-proj">＋ New</button>
    </div>
    <div id="projects-list">
      <div id="projects-empty">
        <div class="big-icon">🏗️</div>
        <p>Select a service to see its projects</p>
      </div>
    </div>
  </div>

  <!-- ── Media Panel ────────────────────────────────────────────────────── -->
  <div id="media-panel">
    <div id="media-header">
      <div id="media-breadcrumb">Select a project to manage its photos &amp; videos</div>
      <div class="header-actions">
        <span id="media-count"></span>
        <button id="btn-upload-trigger" style="display:none">
          ↑ Upload Files
        </button>
        <input type="file" id="file-input" multiple accept="image/*,video/*" />
      </div>
    </div>
    <div id="media-body">
      <div id="no-project-msg">
        <div class="big-icon">🖼️</div>
        <h3>No project selected</h3>
        <p>Select a project from the left to upload and manage its photos and videos.</p>
      </div>
    </div>
  </div>
</div>

<!-- ── Modals ─────────────────────────────────────────────────────────────── -->

<!-- New/Edit Service -->
<div id="modal-service" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="modal-svc-title">
  <div class="modal">
    <h2 id="modal-svc-title">New Service</h2>
    <div class="field"><label>Service Name *</label><input id="svc-name" type="text" placeholder="e.g. Kitchen Remodeling" /></div>
    <div class="field"><label>Icon (emoji)</label><input id="svc-icon" type="text" placeholder="🍳" style="max-width:80px" /></div>
    <div class="field"><label>Description</label><textarea id="svc-desc" placeholder="Short description…"></textarea></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('modal-service')">Cancel</button>
      <button class="btn-save" id="btn-save-svc">Save Service</button>
    </div>
  </div>
</div>

<!-- New/Edit Project -->
<div id="modal-project" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="modal-proj-title">
  <div class="modal">
    <h2 id="modal-proj-title">New Project</h2>
    <div class="field"><label>Project Name *</label><input id="proj-name" type="text" placeholder="e.g. Kitchen Remodel — Northwest DC" /></div>
    <div class="field"><label>Location</label><input id="proj-location" type="text" placeholder="e.g. Northwest, Washington DC" /></div>
    <div class="field"><label>Description</label><textarea id="proj-desc" placeholder="Short description…"></textarea></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('modal-project')">Cancel</button>
      <button class="btn-save" id="btn-save-proj">Save Project</button>
    </div>
  </div>
</div>

<!-- Confirm Delete -->
<div id="modal-confirm" class="modal-backdrop" role="dialog" aria-modal="true">
  <div class="modal">
    <h2 id="confirm-title">Confirm Delete</h2>
    <p id="confirm-body" style="font-size:13.5px;color:var(--muted);line-height:1.6;"></p>
    <div class="modal-actions" style="margin-top:24px;">
      <button class="btn-cancel" onclick="closeModal('modal-confirm')">Cancel</button>
      <button class="btn-danger-save" id="btn-confirm-ok">Delete</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toast"></div>

<script>
// ── State ──────────────────────────────────────────────────────────────────
const state = {
  services: [],
  activeService: null,
  projects: [],
  activeProject: null,
  media: [],
  editSvcId: null,
  editProjId: null,
};

// ── API Helpers ────────────────────────────────────────────────────────────
const api = {
  async get(url) {
    const r = await fetch(url);
    if (!r.ok) throw new Error(await r.text());
    return r.json();
  },
  async post(url, body) {
    const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    if (!r.ok) throw new Error(await r.text());
    return r.json();
  },
  async put(url, body) {
    const r = await fetch(url, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    if (!r.ok) throw new Error(await r.text());
    return r.json();
  },
  async del(url) {
    const r = await fetch(url, { method: 'DELETE' });
    if (!r.ok) throw new Error(await r.text());
    return r.json();
  },
  async uploadFiles(projectId, files) {
    const fd = new FormData();
    for (const f of files) fd.append('files', f);
    const r = await fetch(`/api/projects/${projectId}/media`, { method: 'POST', body: fd });
    if (!r.ok) throw new Error(await r.text());
    return r.json();
  },
};

// ── Toast ──────────────────────────────────────────────────────────────────
let toastTimer;
function toast(msg, type = 'success') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = `show ${type}`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.className = '', 3200);
}

// ── Modal helpers ──────────────────────────────────────────────────────────
function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
document.querySelectorAll('.modal-backdrop').forEach(bd => {
  bd.addEventListener('click', e => { if (e.target === bd) closeModal(bd.id); });
});

// ── Services ───────────────────────────────────────────────────────────────
async function loadServices() {
  state.services = await api.get('/api/services');
  renderServices();
}

function renderServices() {
  const list = document.getElementById('services-list');
  if (!state.services.length) {
    list.innerHTML = '<div style="padding:20px 12px;font-size:12px;color:rgba(255,255,255,0.3);text-align:center;line-height:1.6;">No services yet.<br/>Create your first below.</div>';
    return;
  }
  list.innerHTML = state.services.map(s => `
    <div class="svc-item ${state.activeService?.id === s.id ? 'active' : ''}" data-id="${s.id}">
      <span class="svc-icon">${s.icon || '🏠'}</span>
      <span class="svc-name" style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escHtml(s.name)}</span>
      <div class="svc-item-actions">
        <button class="btn-edit-svc" title="Edit" onclick="event.stopPropagation();editService(${s.id})">✎</button>
        <button class="btn-del-svc" title="Delete" onclick="event.stopPropagation();confirmDeleteService(${s.id})">✕</button>
      </div>
    </div>
  `).join('');
  list.querySelectorAll('.svc-item').forEach(el => {
    el.addEventListener('click', () => selectService(parseInt(el.dataset.id)));
  });
}

async function selectService(id) {
  state.activeService = state.services.find(s => s.id === id);
  state.activeProject = null;
  state.media = [];
  renderServices();
  document.getElementById('projects-panel-title').textContent = state.activeService.name;
  await loadProjects();
  renderMedia(); // clears media panel
}

// ── Service CRUD ───────────────────────────────────────────────────────────
document.getElementById('btn-new-svc').addEventListener('click', () => {
  state.editSvcId = null;
  document.getElementById('modal-svc-title').textContent = 'New Service';
  document.getElementById('svc-name').value = '';
  document.getElementById('svc-icon').value = '';
  document.getElementById('svc-desc').value = '';
  openModal('modal-service');
  setTimeout(() => document.getElementById('svc-name').focus(), 80);
});

function editService(id) {
  const svc = state.services.find(s => s.id === id);
  state.editSvcId = id;
  document.getElementById('modal-svc-title').textContent = 'Edit Service';
  document.getElementById('svc-name').value = svc.name;
  document.getElementById('svc-icon').value = svc.icon || '';
  document.getElementById('svc-desc').value = svc.description || '';
  openModal('modal-service');
  setTimeout(() => document.getElementById('svc-name').focus(), 80);
}

document.getElementById('btn-save-svc').addEventListener('click', async () => {
  const name = document.getElementById('svc-name').value.trim();
  if (!name) { toast('Service name is required', 'error'); return; }
  const body = {
    name,
    icon: document.getElementById('svc-icon').value.trim(),
    description: document.getElementById('svc-desc').value.trim(),
  };
  try {
    if (state.editSvcId) {
      await api.put(`/api/services/${state.editSvcId}`, body);
      toast('Service updated');
    } else {
      await api.post('/api/services', body);
      toast('Service created');
    }
    closeModal('modal-service');
    await loadServices();
  } catch (e) { toast(e.message, 'error'); }
});

function confirmDeleteService(id) {
  const svc = state.services.find(s => s.id === id);
  document.getElementById('confirm-title').textContent = 'Delete Service?';
  document.getElementById('confirm-body').textContent = `This will permanently delete "${svc.name}" and all its projects and media files. This cannot be undone.`;
  document.getElementById('btn-confirm-ok').onclick = async () => {
    try {
      await api.del(`/api/services/${id}`);
      if (state.activeService?.id === id) { state.activeService = null; state.projects = []; state.activeProject = null; state.media = []; }
      closeModal('modal-confirm');
      toast('Service deleted');
      await loadServices();
      renderProjects();
      renderMedia();
    } catch (e) { toast(e.message, 'error'); }
  };
  openModal('modal-confirm');
}

// ── Projects ───────────────────────────────────────────────────────────────
async function loadProjects() {
  if (!state.activeService) { state.projects = []; renderProjects(); return; }
  state.projects = await api.get(`/api/services/${state.activeService.id}/projects`);
  renderProjects();
}

function renderProjects() {
  const list = document.getElementById('projects-list');
  if (!state.activeService) {
    list.innerHTML = '<div id="projects-empty"><div class="big-icon">🏗️</div><p>Select a service to see its projects</p></div>';
    return;
  }
  if (!state.projects.length) {
    list.innerHTML = '<div id="projects-empty"><div class="big-icon">📁</div><p>No projects yet. Create one to start uploading photos.</p></div>';
    return;
  }
  list.innerHTML = state.projects.map(p => {
    const cover = p.cover_media_id ? state.media.find(m => m.id === p.cover_media_id) : null;
    return `
    <div class="proj-card ${state.activeProject?.id === p.id ? 'active' : ''}" data-id="${p.id}">
      ${p.cover_media_id
        ? `<img class="cover-thumb" src="/uploads/${escHtml(getCoverFilename(p))}" alt="" loading="lazy" />`
        : `<div class="cover-placeholder">📸</div>`
      }
      <div class="proj-name">${escHtml(p.name)}</div>
      <div class="proj-meta">
        ${p.location ? `<span>📍 ${escHtml(p.location)}</span>` : ''}
        <span>${p.media_count || 0} photo${p.media_count !== 1 ? 's' : ''}</span>
      </div>
      <div class="proj-actions">
        <button class="btn-edit-proj" title="Edit project" onclick="event.stopPropagation();editProject(${p.id})">✎</button>
        <button class="btn-del-proj" title="Delete project" onclick="event.stopPropagation();confirmDeleteProject(${p.id})">✕</button>
      </div>
    </div>
  `}).join('');
  list.querySelectorAll('.proj-card').forEach(el => {
    el.addEventListener('click', () => selectProject(parseInt(el.dataset.id)));
  });
}

// We need cover filenames — cache them from loaded media
const coverCache = {}; // projectId → filename

function getCoverFilename(proj) {
  return coverCache[proj.id] || '';
}

async function selectProject(id) {
  state.activeProject = state.projects.find(p => p.id === id);
  renderProjects();
  await loadMedia();
}

// ── Project CRUD ───────────────────────────────────────────────────────────
document.getElementById('btn-new-proj').addEventListener('click', () => {
  if (!state.activeService) { toast('Select a service first', 'error'); return; }
  state.editProjId = null;
  document.getElementById('modal-proj-title').textContent = 'New Project';
  document.getElementById('proj-name').value = '';
  document.getElementById('proj-location').value = '';
  document.getElementById('proj-desc').value = '';
  openModal('modal-project');
  setTimeout(() => document.getElementById('proj-name').focus(), 80);
});

function editProject(id) {
  const proj = state.projects.find(p => p.id === id);
  state.editProjId = id;
  document.getElementById('modal-proj-title').textContent = 'Edit Project';
  document.getElementById('proj-name').value = proj.name;
  document.getElementById('proj-location').value = proj.location || '';
  document.getElementById('proj-desc').value = proj.description || '';
  openModal('modal-project');
  setTimeout(() => document.getElementById('proj-name').focus(), 80);
}

document.getElementById('btn-save-proj').addEventListener('click', async () => {
  const name = document.getElementById('proj-name').value.trim();
  if (!name) { toast('Project name is required', 'error'); return; }
  const body = {
    name,
    location: document.getElementById('proj-location').value.trim(),
    description: document.getElementById('proj-desc').value.trim(),
  };
  try {
    if (state.editProjId) {
      await api.put(`/api/projects/${state.editProjId}`, body);
      toast('Project updated');
    } else {
      await api.post(`/api/services/${state.activeService.id}/projects`, body);
      toast('Project created');
    }
    closeModal('modal-project');
    await loadProjects();
  } catch (e) { toast(e.message, 'error'); }
});

function confirmDeleteProject(id) {
  const proj = state.projects.find(p => p.id === id);
  document.getElementById('confirm-title').textContent = 'Delete Project?';
  document.getElementById('confirm-body').textContent = `This will permanently delete "${proj.name}" and all its media files. This cannot be undone.`;
  document.getElementById('btn-confirm-ok').onclick = async () => {
    try {
      await api.del(`/api/projects/${id}`);
      if (state.activeProject?.id === id) { state.activeProject = null; state.media = []; }
      closeModal('modal-confirm');
      toast('Project deleted');
      await loadProjects();
      renderMedia();
    } catch (e) { toast(e.message, 'error'); }
  };
  openModal('modal-confirm');
}

// ── Media ──────────────────────────────────────────────────────────────────
async function loadMedia() {
  if (!state.activeProject) { state.media = []; renderMedia(); return; }
  state.media = await api.get(`/api/projects/${state.activeProject.id}/media`);
  // Cache cover filenames
  state.media.forEach(m => {
    if (state.activeProject.cover_media_id === m.id) {
      coverCache[state.activeProject.id] = m.filename;
    }
  });
  renderMedia();
  // Refresh project card for cover thumb
  renderProjects();
}

function renderMedia() {
  const body = document.getElementById('media-body');
  const header = document.getElementById('media-breadcrumb');
  const countEl = document.getElementById('media-count');
  const uploadBtn = document.getElementById('btn-upload-trigger');

  if (!state.activeProject) {
    header.innerHTML = 'Select a project to manage its photos &amp; videos';
    countEl.textContent = '';
    uploadBtn.style.display = 'none';
    body.innerHTML = `
      <div id="no-project-msg">
        <div class="big-icon">🖼️</div>
        <h3>No project selected</h3>
        <p>Select a project from the left to upload and manage its photos and videos.</p>
      </div>`;
    return;
  }

  // Header
  header.innerHTML = `
    <span style="color:var(--muted)">${escHtml(state.activeService?.name || '')} /</span>
    <strong> ${escHtml(state.activeProject.name)}</strong>
    ${state.activeProject.location ? `<span style="color:var(--muted);font-size:11px"> · 📍 ${escHtml(state.activeProject.location)}</span>` : ''}
  `;
  countEl.textContent = `${state.media.length} file${state.media.length !== 1 ? 's' : ''}`;
  uploadBtn.style.display = 'flex';

  // Body
  body.innerHTML = `
    <div id="drop-zone">
      <div class="dz-icon">☁️</div>
      <div class="dz-title">Drop photos &amp; videos here</div>
      <div class="dz-sub">or <span style="color:var(--t500);cursor:pointer;text-decoration:underline" id="dz-browse-link">click to browse</span> · JPG, PNG, WEBP, MP4, MOV</div>
      <div class="dz-progress">
        <div class="dz-progress-bar"><div class="dz-progress-fill" id="dz-fill"></div></div>
        <div class="dz-progress-text" id="dz-progress-text">Uploading…</div>
      </div>
    </div>
    <div id="media-grid"></div>
  `;

  document.getElementById('dz-browse-link').addEventListener('click', () => document.getElementById('file-input').click());
  setupDropZone();
  renderGrid();
}

function renderGrid() {
  const grid = document.getElementById('media-grid');
  if (!grid) return;
  if (!state.media.length) {
    grid.innerHTML = '<div style="grid-column:1/-1;padding:32px;text-align:center;color:var(--muted);font-size:13px;">No files yet — upload some above.</div>';
    return;
  }
  grid.innerHTML = state.media.map(m => `
    <div class="media-item" draggable="true" data-id="${m.id}" data-type="${m.media_type}">
      ${m.media_type === 'video'
        ? `<video src="/uploads/${escHtml(m.filename)}" preload="metadata" muted></video>`
        : `<img src="/uploads/${escHtml(m.filename)}" alt="${escHtml(m.original_filename)}" loading="lazy" />`
      }
      ${state.activeProject?.cover_media_id === m.id ? '<div class="cover-badge">Cover</div>' : ''}
      <div class="drag-handle">⠿</div>
      <div class="media-actions">
        ${state.activeProject?.cover_media_id !== m.id ? `<button class="btn-set-cover" title="Set as cover" onclick="setCover(${m.id})">★</button>` : ''}
        <button class="btn-del-media" title="Delete" onclick="confirmDeleteMedia(${m.id})">✕</button>
      </div>
      <div class="media-overlay">
        <div class="media-name">${escHtml(m.original_filename)}</div>
      </div>
    </div>
  `).join('');

  setupGridDrag();
}

async function setCover(mediaId) {
  try {
    await api.put(`/api/projects/${state.activeProject.id}`, { cover_media_id: mediaId });
    state.activeProject.cover_media_id = mediaId;
    const m = state.media.find(x => x.id === mediaId);
    if (m) coverCache[state.activeProject.id] = m.filename;
    renderGrid();
    renderProjects();
    toast('Cover photo updated');
  } catch (e) { toast(e.message, 'error'); }
}

function confirmDeleteMedia(id) {
  const m = state.media.find(x => x.id === id);
  document.getElementById('confirm-title').textContent = 'Delete file?';
  document.getElementById('confirm-body').textContent = `"${m.original_filename}" will be permanently deleted. This cannot be undone.`;
  document.getElementById('btn-confirm-ok').onclick = async () => {
    try {
      await api.del(`/api/media/${id}`);
      closeModal('modal-confirm');
      toast('File deleted');
      await loadMedia();
      await loadProjects();
    } catch (e) { toast(e.message, 'error'); }
  };
  openModal('modal-confirm');
}

// ── Upload ─────────────────────────────────────────────────────────────────
document.getElementById('btn-upload-trigger').addEventListener('click', () => document.getElementById('file-input').click());
document.getElementById('file-input').addEventListener('change', e => {
  if (e.target.files.length) handleUpload(Array.from(e.target.files));
  e.target.value = '';
});

function setupDropZone() {
  const dz = document.getElementById('drop-zone');
  if (!dz) return;
  dz.addEventListener('click', () => document.getElementById('file-input').click());
  dz.addEventListener('dragenter', e => { e.preventDefault(); dz.classList.add('drag-over'); });
  dz.addEventListener('dragover',  e => { e.preventDefault(); dz.classList.add('drag-over'); });
  dz.addEventListener('dragleave', e => { if (!dz.contains(e.relatedTarget)) dz.classList.remove('drag-over'); });
  dz.addEventListener('drop', e => {
    e.preventDefault(); dz.classList.remove('drag-over');
    const files = Array.from(e.dataTransfer.files).filter(f => f.type.match(/^image\/|^video\//));
    if (files.length) handleUpload(files);
  });
}

async function handleUpload(files) {
  if (!state.activeProject) { toast('Select a project first', 'error'); return; }
  const dz = document.getElementById('drop-zone');
  const fill = document.getElementById('dz-fill');
  const progressText = document.getElementById('dz-progress-text');
  if (!dz) return;

  dz.classList.add('uploading');
  const prog = dz.querySelector('.dz-progress');
  prog.style.display = 'block';
  fill.style.width = '0%';
  progressText.textContent = `Uploading ${files.length} file${files.length !== 1 ? 's' : ''}…`;

  // Upload in batches of 10 to avoid timeouts
  const BATCH = 10;
  let uploaded = 0;
  try {
    for (let i = 0; i < files.length; i += BATCH) {
      const batch = files.slice(i, i + BATCH);
      await api.uploadFiles(state.activeProject.id, batch);
      uploaded += batch.length;
      fill.style.width = `${Math.round((uploaded / files.length) * 100)}%`;
      progressText.textContent = `Uploaded ${uploaded} / ${files.length}`;
    }
    toast(`${uploaded} file${uploaded !== 1 ? 's' : ''} uploaded`);
    await loadMedia();
    await loadProjects();
  } catch (e) {
    toast('Upload failed: ' + e.message, 'error');
  } finally {
    if (dz) {
      dz.classList.remove('uploading');
      if (prog) prog.style.display = 'none';
    }
  }
}

// ── Grid drag-to-reorder ───────────────────────────────────────────────────
let dragSrcId = null;

function setupGridDrag() {
  const grid = document.getElementById('media-grid');
  if (!grid) return;
  grid.querySelectorAll('.media-item').forEach(item => {
    item.addEventListener('dragstart', e => {
      dragSrcId = parseInt(item.dataset.id);
      item.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    });
    item.addEventListener('dragend', () => {
      item.classList.remove('dragging');
      grid.querySelectorAll('.media-item').forEach(i => i.classList.remove('drag-over-item'));
    });
    item.addEventListener('dragenter', e => {
      e.preventDefault();
      grid.querySelectorAll('.media-item').forEach(i => i.classList.remove('drag-over-item'));
      if (item.dataset.id != dragSrcId) item.classList.add('drag-over-item');
    });
    item.addEventListener('dragover', e => e.preventDefault());
    item.addEventListener('drop', async e => {
      e.preventDefault();
      item.classList.remove('drag-over-item');
      const targetId = parseInt(item.dataset.id);
      if (dragSrcId === targetId) return;
      // Reorder in state
      const ids = state.media.map(m => m.id);
      const srcIdx = ids.indexOf(dragSrcId);
      const tgtIdx = ids.indexOf(targetId);
      const [moved] = state.media.splice(srcIdx, 1);
      state.media.splice(tgtIdx, 0, moved);
      renderGrid();
      // Persist
      try {
        await fetch(`/api/projects/${state.activeProject.id}/media/reorder`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ order: state.media.map(m => m.id) }),
        });
      } catch (_) {}
    });
  });
}

// ── Keyboard shortcuts ─────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    document.querySelectorAll('.modal-backdrop.open').forEach(m => m.classList.remove('open'));
  }
});

// ── Util ───────────────────────────────────────────────────────────────────
function escHtml(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Init ───────────────────────────────────────────────────────────────────
loadServices();
</script>
</body>
</html>
